name: Build Pause

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        env:
          KEY_B64: ${{ secrets.PAUSE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/pause.jks"
            echo "PAUSE_KEYSTORE=$RUNNER_TEMP/pause.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          PAUSE_KEYSTORE_PASSWORD: ${{ secrets.PAUSE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the file
        run: cp app/build/outputs/apk/release/*.apk Pause.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Pause
          path: Pause.apk

      - name: Put it on the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Pause (latest build)" --notes "Install Pause.apk on your phone."
          gh release upload latest Pause.apk --clobber
